# Publishes @baquia-dev/specty to npm, with provenance, when a version tag (`v<version>`) is pushed.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  # Provenance: npm records which workflow, commit and repository built the package.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - name: The tag is the package's version
        working-directory: packages/cli
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - run: pnpm check
      # `prepack` builds the UI and puts it next to the bundle.
      - name: Publish
        working-directory: packages/cli
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

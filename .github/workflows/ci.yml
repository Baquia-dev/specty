# `pnpm check` (lint, types, file sizes, knip and tests) on the three systems Specty supports.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    # Windows has never run: it reports without blocking until it passes once.
    continue-on-error: ${{ matrix.os == 'windows-latest' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22]
        include:
          - os: ubuntu-latest
            node: 24
    steps:
      # The tests compare text byte by byte: no CRLF on Windows.
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check

  # Specty checks itself with the pull request's own `specty check --changed`: only what the PR
  # adds or makes grow fails, so functions that were already long do not block it.
  specty-check:
    name: specty check --changed
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      # `--changed` starts at the merge-base with the local main, which the checkout does not
      # create: without it, the run would compare with HEAD and see nothing.
      - run: git branch main origin/main
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @baquia-dev/specty build
      - run: node packages/cli/dist/specty.mjs check --changed
      # Each commit of the pull request traces back to an approved change; it reads the event.
      - run: node packages/cli/dist/specty.mjs ci

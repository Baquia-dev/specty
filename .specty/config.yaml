# Configuración de Specty. Referencia: docs/formats.md §6
version: 1
language: es
mode: individual
# Rutas donde rige el flujo: código que necesita una spec aprobada.
governed: ["**"]
# Rutas libres: documentación y archivos que no son código.
ignored: ["**/*.md", "docs/**"]
# Rutas que nunca se aprueban solas y que pesan en el tamaño.
sensitive:
  ["**/migrations/**", "**/auth/**", ".github/**", "**/.env*", "**/infra/**"]
verify:
  default: "pnpm test"
  full: "pnpm check"
  timeoutSec: 2000
  processes:
    env: ["VITEST_MAX_WORKERS"]
  units:
    - name: estático
      command: "pnpm lint && pnpm typecheck && pnpm sources && pnpm knip"
      paths:
        [
          "packages/**",
          "evals/**",
          "scripts/**",
          "package.json",
          "pnpm-lock.yaml",
          "pnpm-workspace.yaml",
          "tsconfig.base.json",
          "biome.json",
          "knip.json",
          ".agents/**",
          ".claude/**",
        ]
    - name: core
      command: "pnpm --filter @baquia-dev/specty-core test"
      paths:
        [
          "packages/core/**",
          "docs/ARCHITECTURE.md",
          "package.json",
          "pnpm-lock.yaml",
          "tsconfig.base.json",
        ]
    - name: exporters
      command: "pnpm --filter @baquia-dev/specty-exporters test"
      paths:
        [
          "packages/exporters/**",
          "packages/core/**",
          "package.json",
          "pnpm-lock.yaml",
          "tsconfig.base.json",
        ]
    - name: vscode
      command: "pnpm --filter specty-vscode test"
      paths:
        [
          "packages/vscode/**",
          "packages/core/**",
          "package.json",
          "pnpm-lock.yaml",
          "tsconfig.base.json",
        ]
    - name: ui
      command: "pnpm --filter @baquia-dev/specty-ui test"
      paths:
        [
          "packages/ui/**",
          "packages/core/**",
          "packages/exporters/**",
          "package.json",
          "pnpm-lock.yaml",
          "tsconfig.base.json",
        ]
    - name: cli
      command: "pnpm --filter @baquia-dev/specty test"
      paths:
        [
          "packages/cli/**",
          "packages/core/**",
          "packages/exporters/**",
          "docs/**",
          "scripts/**",
          "action.yml",
          ".github/**",
          "package.json",
          "pnpm-lock.yaml",
          "tsconfig.base.json",
          "LICENSE",
          "NOTICE",
        ]

scope:
  implicitTests: true
  generated: []
  autoApprove: tests-and-generated
policy:
  tests: contract
retro:
  mode: agent
git:
  branchPerChange: true
  afterLanding: "pnpm --filter @baquia-dev/specty build"
split:
  maxModules: 3
lines:
  exclude: ["packages/core/src/index.ts", "packages/core/src/cards/index.ts"]
